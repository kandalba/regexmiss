[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kandalba-regexmiss"
version = "0.1.0"
description = "解析时间标记，排列敏感数据的正则漏检的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "kandalba" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://kandalba.github.io"
Repository = "https://github.com/kandalba/regexmiss"
Issues = "https://github.com/kandalba/regexmiss/issues"

[project.scripts]
regexmiss = "regexmiss:main"

[tool.setuptools]
py-modules = ["regexmiss"]
